<html>
  <head>
    <title>Arknights Shop History</title>
    <link type="text/css" href="/css/reset.css" rel="stylesheet" />
    <link type="text/css" href="/css/style.css" rel="stylesheet" />
    <link type="text/css" href="/css/style2.css" rel="stylesheet" />
    <link type="text/css" rel="stylesheet" href="/css/all.min.css" />
    <link type="text/css" href="/css/shoplist-extra.css" rel="stylesheet" />
    <script type="text/javascript" src="/js/chart.3.5.1.min.js"></script>
    <script
      type="text/javascript"
      src="/js/chartjs-adapter-date-fns.bundle.2.0.0.min.js"
    ></script>
    <script type="text/javascript" src="/js/util.js"></script>
    <meta charset="UTF-8" />
  </head>
  <body ontouchstart>
    <div id="topNav">
      <div class="nav-left">
        <a id="pageTitle">Shop Operator History</a>
      </div>
      <div class="nav-right">
        <a class="rightButton button iconButton" href="/" id="homeButton"></a>
      </div>
    </div>
    <div class="btnPanel" id="localServerSelect"></div>
    <div class="btnPanel" id="raritySelect"></div>
    <div class="btnPanel" id="sortSelect"></div>
    <div class="btnPanel" id="periodSelect"></div>
    <div id="chartLegend">
      <span><span class="legendSwatch legendFirst"></span> First released, not yet in shop</span>
      <span><span class="legendSwatch legendGold"></span> Shop rotation &middot; Standard/Limited pool</span>
      <span><span class="legendSwatch legendBlue"></span> Shop rotation &middot; Kernel pool</span>
      <span class="legendHint">Hover a portrait for the exact date (Standard-pool ops not yet in the shop get a predicted debut)</span>
    </div>
    <div id="chartDiv" style="padding-top: 8px">
      <div class="chartContainer chartOption" id="barChartContainer">
        <canvas id="opChart"></canvas>
      </div>
      <canvas id="scatterChart" class="chartOption"></canvas>
    </div>
    <script type="text/javascript" src="/js/shoplist.js"></script>
  </body>
</html>
