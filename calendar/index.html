<html>
  <head>
    <title>Arknights EN Event Calendar</title>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Past and upcoming EN server events. Confirmed dates once known, estimated dates for events not yet confirmed."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ak.athansson.com/calendar/" />
    <meta property="og:title" content="EN Event Calendar" />
    <meta
      property="og:description"
      content="Past and upcoming EN server events. Confirmed dates once known, estimated dates for events not yet confirmed."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link type="text/css" href="/css/reset.css" rel="stylesheet" />
    <link type="text/css" href="/css/style.css" rel="stylesheet" />
    <link type="text/css" href="/css/style2.css" rel="stylesheet" />
    <link type="text/css" rel="stylesheet" href="/css/all.min.css" />
    <link type="text/css" href="/css/calendar-extra.css" rel="stylesheet" />
    <script type="text/javascript" src="/js/config.js"></script>
  </head>
  <body ontouchstart>
    <div id="topNav">
      <div class="nav-left">
        <a id="pageTitle">EN Event Calendar</a>
      </div>
      <div class="nav-right">
        <a
          class="rightButton button iconButton"
          href="/calendar/about"
          id="aboutButton"
          aria-label="About this calendar"
        ></a>
        <a class="rightButton button iconButton" href="/" id="homeButton"></a>
      </div>
    </div>
    <div id="calendarLegend">
      <span><span class="legendSwatch legendConfirmed"></span> Confirmed</span>
      <span><span class="legendSwatch legendAnnounced"></span> Announced</span>
      <span><span class="legendSwatch legendEstimated"></span> Estimated</span>
      <span><span class="legendSwatch legendCnExclusive"></span> CN exclusive</span>
      <span class="legendHint" id="lagHint"></span>
    </div>
    <div id="calendarControls">
      <div class="controlGroup viewToggle" id="viewToggle">
        <button type="button" class="viewToggleBtn active" data-view="calendar">Calendar</button>
        <button type="button" class="viewToggleBtn" data-view="list">List</button>
      </div>
      <div class="controlGroup statusFilters" id="statusFilters">
        <label><input type="checkbox" value="confirmed" checked /> Confirmed</label>
        <label><input type="checkbox" value="announced" checked /> Announced</label>
        <label><input type="checkbox" value="estimated" checked /> Estimated</label>
        <label><input type="checkbox" value="cnExclusive" checked /> CN exclusive</label>
      </div>
      <div class="controlGroup sortGroup" id="sortGroup">
        <label for="sortSelect">Sort</label>
        <select id="sortSelect">
          <option value="date">Date</option>
          <option value="name">Name</option>
        </select>
      </div>
    </div>
    <div id="calendarViewRoot">
      <div id="weekNav">
        <button type="button" id="prevWeekBtn" aria-label="Previous week">&lsaquo;</button>
        <span id="weekLabel"></span>
        <button type="button" id="nextWeekBtn" aria-label="Next week">&rsaquo;</button>
        <button type="button" id="todayBtn">Today</button>
      </div>
      <div id="weekGrid"></div>
    </div>
    <div id="calendarContent">
      <h2 class="calendarSectionHeading">Upcoming</h2>
      <div id="upcomingList" class="eventList">
        <div class="eventListLoading">Loading&hellip;</div>
      </div>
      <h2 class="calendarSectionHeading">Past</h2>
      <div id="pastList" class="eventList"></div>
    </div>
    <div id="pageCredit">
      Event data from
      <a href="https://arknights.wiki.gg/wiki/Event" target="_blank" rel="noopener">Arknights Terra Wiki</a>
    </div>
    <script type="text/javascript" src="/js/calendar.js"></script>
  </body>
</html>
