name: Update banner history
on:
  # No `schedule:` trigger on purpose: GitHub auto-disables a scheduled
  # workflow after 60 days with no repo activity. Instead a Cloudflare
  # Worker's Cron Trigger calls the GitHub API once a day to fire this via
  # workflow_dispatch below. See cloudflare/dispatch-cron/index.js and the
  # README's "Hands-off forever" section for the Worker setup.
  workflow_dispatch:
# One run at a time: a manual run started while the daily one is still
# going waits for it instead of racing it to commit the same files.
concurrency:
  group: data-update
  cancel-in-progress: false
permissions:
  # contents: the commit step below pushes the refreshed json/images.
  # issues: the "Data update problem" issue at the end (see that step).
  contents: write
  issues: write
jobs:
  run:
    name: Update banner history
    runs-on: ubuntu-latest
    # A normal run takes a few minutes; a hung wiki request shouldn't be
    # able to hold the concurrency slot for GitHub's default 6 hours.
    timeout-minutes: 30
    defaults:
      run:
        # the scraper scripts live in this subfolder (in upstream
        # akgcc/akgcc-extra-data they're at the repo root)
        working-directory: akgcc-extra-data
    steps:
      # Actions are pinned to an exact commit (the tag it was at is in the
      # comment), so a moved or compromised tag can't change what runs here
      # with this job's write access. Bump them deliberately.
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        # Pinned versions (requirements.txt), so a new release can't break
        # the daily run without a commit here.
        run: pip install -r requirements.txt
      # The four updates are independent: one failing must not stop the
      # others (or the commit below) from running, so each has
      # `continue-on-error` and an id whose `outcome` the health step reads.
      # The job is still made to fail at the very end if any of them did --
      # see "Fail the run" -- so a broken scraper shows up as a red run
      # rather than being swallowed.
      - name: Update shop history
        id: shop
        continue-on-error: true
        run: python shop_operators.py
      - name: Update operator release dates
        id: operators
        continue-on-error: true
        run: python operator_online.py
      - name: Update EN event dates (past + estimated upcoming)
        id: events
        continue-on-error: true
        run: python events.py
      - name: Build slim game data
        # Slim copies of the game-data tables the site reads (see
        # game_data.py) -- what the pages load instead of the full tables.
        # If this fails, yesterday's files stay and the site keeps working
        # (it also falls back to the full tables if a file is missing).
        id: gamedata
        continue-on-error: true
        env:
          # Optional: translates CN-only text to English (see translate.py).
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python game_data.py
      - name: Record data health
        # Writes json/meta.json (see health.py): which steps worked, how
        # much data each produced, and anything degraded -- the site shows
        # "Updated X ago" and a warning from it.
        if: always()
        run: python health.py shop=${{ steps.shop.outcome }} operators=${{ steps.operators.outcome }} events=${{ steps.events.outcome }} gamedata=${{ steps.gamedata.outcome }}
      - name: Commit changes
        # Plain git rather than a third-party action, since this step has the
        # job's write access. Only the pipeline's output is staged.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add json/*.json json/gamedata images
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "update banner history"
          # If main moved after this job's checkout (you pushed while it was
          # running), rebase this commit on top before pushing. A few tries
          # in case another push lands in between.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            echo "Push attempt $attempt failed; retrying."
            sleep 10
          done
          exit 1
      - name: Open / close the data problem issue
        # A problem that lasts two runs in a row (meta.json's problemRuns --
        # one transient wiki hiccup shouldn't open an issue) gets a GitHub
        # issue, which emails the repo owner; the first healthy run after
        # that comments and closes it. Never fails the run itself.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Data update problem"
          runs=$(jq -r '.problemRuns // 0' json/meta.json)
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$runs" -ge 2 ] && [ -z "$open" ]; then
            {
              echo "The daily data update has had a problem for $runs runs in a row. The site is still serving the last good data."
              echo
              jq -r '.warnings[] | "- " + .message' json/meta.json
              echo
              echo "Latest run: $run_url"
              echo
              echo "This issue closes itself once a run comes back healthy."
            } > issue_body.md
            gh issue create --title "$title" --body-file issue_body.md
          elif [ "$runs" -eq 0 ] && [ -n "$open" ]; then
            gh issue close "$open" --comment "Recovered: the update is healthy again ($run_url)."
          fi
      - name: Fail the run if any update failed
        if: always()
        run: |
          if [ "${{ steps.shop.outcome }}" != "success" ] || [ "${{ steps.operators.outcome }}" != "success" ] || [ "${{ steps.events.outcome }}" != "success" ] || [ "${{ steps.gamedata.outcome }}" != "success" ]; then
            echo "::error::An update step failed (shop=${{ steps.shop.outcome }}, operators=${{ steps.operators.outcome }}, events=${{ steps.events.outcome }}, gamedata=${{ steps.gamedata.outcome }}) -- see its log above."
            exit 1
          fi
